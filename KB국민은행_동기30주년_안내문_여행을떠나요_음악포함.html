<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KB국민은행 동기 30주년 기념 행사</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 14px 10px 26px;
      background:
        radial-gradient(circle at 20% 0%, rgba(215,179,106,.18), transparent 28%),
        radial-gradient(circle at 86% 12%, rgba(215,179,106,.10), transparent 24%),
        linear-gradient(180deg, #080706 0%, #15100b 52%, #080706 100%);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    .wrap {
      width: min(100%, 430px);
      margin: 0 auto;
    }

    .music-card {
      margin: 0 0 12px;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(215,179,106,.42);
      background:
        linear-gradient(180deg, rgba(255,246,232,.98), rgba(247,234,212,.96));
      color: #191715;
      box-shadow: 0 12px 32px rgba(0,0,0,.38);
      overflow: hidden;
    }

    .music-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 900;
      color: #6f4f1d;
      letter-spacing: -0.03em;
    }

    .music-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #fff4c8, #bd8d3d);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #17120d;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.12), 0 4px 10px rgba(0,0,0,.18);
      flex: 0 0 auto;
    }

    .music-frame {
      width: 100%;
      height: 88px;
      border: 0;
      border-radius: 13px;
      display: block;
      background: #000;
    }

    .music-guide {
      margin-top: 8px;
      font-size: 11px;
      line-height: 1.55;
      color: #6d5f4d;
      letter-spacing: -0.03em;
    }

    .poster-card {
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(215,179,106,.38);
      box-shadow: 0 22px 60px rgba(0,0,0,.52);
      background: #111;
    }

    .poster-img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
